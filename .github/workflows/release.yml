name: release.yml

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: release-vue-product
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # npm trusted publishing requires npm >= 11.5.1 and exchanges the GitHub OIDC token at publish time.
      - name: Install npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate READMEs (safety net)
        run: node scripts/generate-readmes.mjs

      - name: Build packages
        run: pnpm build:packages

      - name: Product quality gates
        run: |
          pnpm type-check
          pnpm test:packages:ci
          pnpm --filter @363045841yyt/klinechart lint:publish
          pnpm lint:types

      - name: Pack and verify the Vue product
        run: |
          pnpm pack:product
          pnpm exec playwright install --with-deps chromium
          pnpm test:product

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vue-product
          path: artifacts/product

      - name: Publish verified Vue product to npm
        run: node scripts/publish-product.mjs

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${GITHUB_REF_NAME}"
          git fetch --force --tags

          notes_file="release-notes.md"

          # 优先使用本地生成的 release 日志（docs/release/<tag>.md）
          if [ -f "docs/release/${current_tag}.md" ]; then
            echo "📝 使用 docs/release/${current_tag}.md 作为 release notes"
            cp "docs/release/${current_tag}.md" "$notes_file"
            previous_tag="$(git tag --sort=-creatordate | awk -v current="$current_tag" '$0 != current { print; exit }')"
            if [ -n "$previous_tag" ]; then
              range="$previous_tag..$current_tag"
            else
              range="$current_tag"
            fi
            {
              echo 'previous_tag<<EOF'
              echo "$previous_tag"
              echo 'EOF'
              echo 'range<<EOF'
              echo "$range"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 兜底：未找到日志文件时自动生成
          echo "⚠️ 未找到 docs/release/${current_tag}.md，回退到自动生成 release notes"
          previous_tag="$(git tag --sort=-creatordate | awk -v current="$current_tag" '$0 != current { print; exit }')"

          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$current_tag"
          else
            range="$current_tag"
          fi

          CURRENT_TAG="$current_tag" PREVIOUS_TAG="$previous_tag" RANGE="$range" python <<'PY'
          import os
          import re
          import subprocess
          from collections import OrderedDict

          current_tag = os.environ["CURRENT_TAG"]
          previous_tag = os.environ.get("PREVIOUS_TAG", "")
          git_range = os.environ["RANGE"]

          result = subprocess.run(
              ["git", "log", "--format=%H%x09%s", git_range],
              capture_output=True,
              text=True,
              check=True,
          )

          lines = [line for line in result.stdout.splitlines() if line.strip()]

          sections = OrderedDict([
              ("🚀 Performance", []),
              ("🏗️ Architecture", []),
              ("✨ Features", []),
              ("🔧 Improvements", []),
              ("🐛 Fixes", []),
          ])

          arch_keywords = (
              "architecture",
              "renderer",
              "rendering pipeline",
              "plugin",
              "updatelevel",
              "overlay",
              "layer",
              "scheduler",
          )

          def clean_subject(subject: str) -> str:
              cleaned = re.sub(r"^[a-z]+(?:\([^)]*\))?!?:\s*", "", subject, flags=re.IGNORECASE)
              cleaned = cleaned.strip()
              if not cleaned:
                  cleaned = subject.strip()
              if cleaned:
                  cleaned = cleaned[0].upper() + cleaned[1:]
              return cleaned

          def classify(raw_subject: str, cleaned_subject: str) -> str:
              raw_lower = raw_subject.lower()
              cleaned_lower = cleaned_subject.lower()
              if raw_lower.startswith("perf"):
                  return "🚀 Performance"
              if raw_lower.startswith("feat"):
                  return "✨ Features"
              if raw_lower.startswith("fix"):
                  return "🐛 Fixes"
              if raw_lower.startswith("refactor") and any(keyword in cleaned_lower for keyword in arch_keywords):
                  return "🏗️ Architecture"
              if any(keyword in cleaned_lower for keyword in arch_keywords):
                  return "🏗️ Architecture"
              return "🔧 Improvements"

          for line in lines:
              full_sha, subject = line.split("\t", 1)
              short_sha = full_sha[:7]
              cleaned = clean_subject(subject)
              section = classify(subject, cleaned)
              sections[section].append(f"- {cleaned} ({short_sha})")

          body = []
          if previous_tag:
              body.append(f"Changes since {previous_tag}\n")
          else:
              body.append(f"Release {current_tag}\n")

          has_entries = False
          for title, items in sections.items():
              if not items:
                  continue
              has_entries = True
              body.append(title)
              body.extend(items)
              body.append("")

          if not has_entries:
              body.append("🔧 Improvements")
              body.append(f"- Release {current_tag}")
              body.append("")

          output = "\n".join(body).rstrip() + "\n"
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(output)
          PY

          {
            echo 'previous_tag<<EOF'
            echo "$previous_tag"
            echo 'EOF'
            echo 'range<<EOF'
            echo "$range"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PRERELEASE_FLAG=""
          if echo "${GITHUB_REF_NAME#v}" | grep -qE '-(alpha|beta|rc)\.'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --notes-file release-notes.md --title "$GITHUB_REF_NAME" $PRERELEASE_FLAG
          fi

  electron-release:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('packages/desktop-electron/package.json') }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vue product and its internal resources
        run: pnpm build:product

      - name: Build & package desktop
        run: pnpm --filter @363045841yyt/klinechart-desktop build

      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd packages/desktop-electron/dist
          case "${{ runner.os }}" in
            Linux)   pattern="*.AppImage" ;;
            macOS)   pattern="*.dmg" ;;
            Windows) pattern="*-Setup-*.exe" ;;
          esac
          gh release upload "${{ github.ref_name }}" $pattern --clobber

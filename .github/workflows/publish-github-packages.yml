name: publish-github-packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-gh-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # 认证 GitHub Packages
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc

          TAG="${GITHUB_REF_NAME#v}"
          if echo "$TAG" | grep -qE '-(alpha|beta|rc)\.'; then
            if echo "$TAG" | grep -qE '-alpha\.'; then
              NPM_TAG=alpha
            elif echo "$TAG" | grep -qE '-beta\.'; then
              NPM_TAG=beta
            else
              NPM_TAG=rc
            fi
          else
            NPM_TAG=latest
          fi

          echo "Publishing to GitHub Packages — tag '$NPM_TAG'"

          # 构建已在上一步 pnpm build:packages 完成，publish 只上传已构建产物：
          # --ignore-scripts 避免在改写后的清单上再跑 pnpm 脚本（否则会触发依赖校验并自动 install）。
          # GitHub Packages 要求包名 scope 属于仓库 owner，必须把 @363045841yyt 改写为 @363045841；
          # 改名会连带改写依赖名，pnpm 无法再把 workspace: 协议解析到工作区包，故这里手动翻译为具体版本。
          publish_gh_package() {
            local package_dir="$1"
            cd "$GITHUB_WORKSPACE/packages/$package_dir"
            cp package.json package.json.bak
            trap 'mv -f package.json.bak package.json' EXIT
            # workspace:^ → ^<TAG>，workspace:* → <TAG>；裸 ^/* 是无效 semver range，必须写入版本号。
            sed -i "s/workspace:\^/^${TAG}/g" package.json
            sed -i "s/workspace:\*/${TAG}/g" package.json
            sed -i 's/"@363045841yyt\//"@363045841\//g' package.json
            npm publish --registry=https://npm.pkg.github.com --tag "$NPM_TAG" --ignore-scripts
            mv package.json.bak package.json
            trap - EXIT
          }

          # 发布顺序同 npm：core -> agent-runtime -> vue。
          publish_gh_package core
          publish_gh_package agent-runtime
          publish_gh_package vue

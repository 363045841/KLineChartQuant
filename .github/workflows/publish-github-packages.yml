name: publish-github-packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TZ: Asia/Shanghai

concurrency:
  group: publish-gh-vue-product
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Product quality gates
        run: |
          pnpm type-check
          pnpm test:packages:ci
          pnpm --filter @363045841yyt/klinechart lint:publish
          pnpm lint:types
      - name: Pack and verify registry product
        env:
          PRODUCT_PACKAGE_NAME: '@363045841/klinechart'
        run: |
          pnpm pack:product
          pnpm exec playwright install --with-deps chromium
          pnpm test:product
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vue-product-github
          path: artifacts/product
      - name: Publish verified Vue product
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_REGISTRY: https://npm.pkg.github.com
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
          node scripts/publish-product.mjs

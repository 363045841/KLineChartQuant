# 只打桌面安装包的手动工作流：不发 npm、不碰 Release，产物走 workflow artifact。
# 正式发版仍由 release.yml 负责；这里的步骤与它的 electron-release 保持一致。
name: desktop.yml

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建平台，逗号分隔：windows / macos / linux，或 all'
        default: windows
        type: string

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  # 手动输入决定 matrix：GitHub 的 jobs.<id>.if 拿不到 matrix 上下文，只能先算出来。
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          case "$PLATFORMS" in
            all) list="windows macos linux" ;;
            *)   list="${PLATFORMS//,/ }" ;;
          esac
          entries=""
          for name in $list; do
            case "$name" in
              windows) entry='{"os":"windows-latest","artifact":"windows-x64"}' ;;
              macos)   entry='{"os":"macos-latest","artifact":"macos"}' ;;
              linux)   entry='{"os":"ubuntu-latest","artifact":"linux-x64"}' ;;
              *) echo "未知平台：$name（可用 windows / macos / linux / all）" >&2; exit 1 ;;
            esac
            entries="${entries:+$entries,}$entry"
          done
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('packages/desktop-electron/package.json') }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Go connector 随包分发，构建机必须有 Go；源码按 backends.json 的 commit 克隆。
      - name: Setup Go for the bundled connectors
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Build Vue product and its internal resources
        run: pnpm build:product

      - name: Build and package desktop
        run: pnpm --filter @363045841yyt/klinechart-desktop build

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            packages/desktop-electron/dist/*.exe
            packages/desktop-electron/dist/*.dmg
            packages/desktop-electron/dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

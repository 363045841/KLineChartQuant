# 只打桌面安装包的手动工作流：不发 npm、不碰 Release，产物走 workflow artifact。
# 正式发版仍由 release.yml 负责；这里的步骤与它的 electron-release 保持一致。
name: desktop.yml

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'windows / macos（四个包）/ linux / all；也可指定 macos12-x64 等单个 Mac 包，逗号分隔'
        default: windows
        type: string

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  # 手动输入决定 matrix：GitHub 的 jobs.<id>.if 拿不到 matrix 上下文，只能先算出来。
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          echo "matrix=$(node scripts/desktop-build-matrix.mjs "$PLATFORMS")" >> "$GITHUB_OUTPUT"

  desktop:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-desktop
        with:
          profile: ${{ matrix.profile }}
          arch: ${{ matrix.arch }}
          go-version: ${{ matrix.goVersion }}

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            packages/desktop-electron/dist/*.exe
            packages/desktop-electron/dist/*.dmg
            packages/desktop-electron/dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

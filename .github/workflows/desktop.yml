# 只打桌面安装包的手动工作流：不发 npm、不碰 Release，产物走 workflow artifact。
# 正式发版仍由 release.yml 负责；这里的步骤与它的 electron-release 保持一致。
name: desktop.yml

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建平台：windows / macos / macos-intel / linux，逗号分隔，或 all'
        default: windows
        type: string

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  # 手动输入决定 matrix：GitHub 的 jobs.<id>.if 拿不到 matrix 上下文，只能先算出来。
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          case "$PLATFORMS" in
            all) list="windows macos linux" ;;
            *)   list="${PLATFORMS//,/ }" ;;
          esac
          entries=""
          for name in $list; do
            case "$name" in
              windows) entry='{"os":"windows-latest","artifact":"windows-x64"}' ;;
              macos)   entry='{"os":"macos-latest","artifact":"macos"}' ;;
              macos-intel) entry='{"os":"macos-15-intel","artifact":"macos12-intel"}' ;;
              linux)   entry='{"os":"ubuntu-24.04","artifact":"linux-x64"}' ;;
              *) echo "未知平台：$name（可用 windows / macos / macos-intel / linux / all）" >&2; exit 1 ;;
            esac
            entries="${entries:+$entries,}$entry"
          done
          echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('packages/desktop-electron/package.json') }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop root startup
        run: pnpm --filter @363045841yyt/klinechart-desktop test src/__tests__/app-startup.test.ts --maxWorkers=2

      # Go connector 随包分发，构建机必须有 Go；源码按 backends.json 的 commit 克隆。
      - name: Setup Go for the bundled connectors
        uses: actions/setup-go@v6
        with:
          # Go 1.27 的运行时要求 macOS 13，兼容分支不能自动升级工具链。
          go-version: 1.26.10
          cache: false

      - name: Build Vue product and its internal resources
        run: pnpm build:product

      - name: Test desktop package
        run: pnpm --filter @363045841yyt/klinechart-desktop test --maxWorkers=2

      - name: Build and package desktop
        if: matrix.artifact != 'macos12-intel'
        env:
          GOTOOLCHAIN: local
        run: pnpm --filter @363045841yyt/klinechart-desktop build

      # 单独验收 Intel Monterey；不提前生成用户尚未验收的 arm64 包。
      - name: Build Intel macOS 12 package
        if: matrix.artifact == 'macos12-intel'
        env:
          GOTOOLCHAIN: local
        run: |
          pnpm --filter @363045841yyt/klinechart-desktop exec node ../../scripts/build-backends.mjs --target darwin-x64
          (cd node_modules/.tmp/backends/gotdx && go test ./...)
          pnpm --filter @363045841yyt/klinechart-desktop exec electron-vite build
          pnpm --filter @363045841yyt/klinechart-desktop exec electron-builder --mac dmg --x64

      - name: Verify Intel package compatibility and startup
        if: matrix.artifact == 'macos12-intel'
        run: |
          APP="packages/desktop-electron/dist/mac/KLineChart Quant.app"
          node scripts/check-macos-package.mjs "$APP" | tee packages/desktop-electron/dist/macos12-intel-check.txt
          node scripts/smoke-macos-desktop.mjs "$APP" | tee -a packages/desktop-electron/dist/macos12-intel-check.txt
          shasum -a 256 packages/desktop-electron/dist/*.dmg > packages/desktop-electron/dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            packages/desktop-electron/dist/*.exe
            packages/desktop-electron/dist/*.dmg
            packages/desktop-electron/dist/*.AppImage
            packages/desktop-electron/dist/macos12-intel-check.txt
            packages/desktop-electron/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

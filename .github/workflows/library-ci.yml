# Library CI — runs on every push and PR to main.
#
# Gate state:
#   - REQUIRED  : package tests, lint:types (attw)
#   - WARN-ONLY : size:packages, lint:publish, build
#
# lint:types checks the *packed* output of each publishable package, so the
# `test` job builds them before running the gate. The remaining warn-only
# gates still need their own fixes before they can block merges; see
# docs/CI_GATES.md for the current matrix and blockers.

name: library-ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: library-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Locale-dependent tests in src/utils/__tests__/dateFormat.spec.ts assume
  # CST (UTC+8) — they were written by the upstream maintainer against
  # local time. CI's default UTC causes off-by-one-day failures around the
  # year boundary. Pin TZ here so the legacy suite matches the maintainer's
  # original calibration. Long-term fix: rewrite dateFormat helpers + tests
  # in UTC-explicit terms (tracked as a follow-up; needs maintainer review
  # because it changes user-visible date strings).
  TZ: 'Asia/Shanghai'

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned to engines field in root package.json:
        #   "node": "^22.12.0 || >=24.0.0"
        node: ['22.12', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # No packageManager field in root yet; pin to latest 9.x.
          # When packageManager is set, action-setup reads it automatically.
          version: 9

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint:types inspects the packed output of every publishable package, so
      # they must be built first, in workspace dependency order:
      # core -> agent-runtime -> vue; react and angular depend on core.
      - name: Build packages under the type-resolution gate
        run: |
          pnpm build:packages
          pnpm --filter @363045841yyt/klinechart-react build
          pnpm --filter @363045841yyt/klinechart-angular build

      - name: Run package tests (pnpm -r test)
        run: pnpm test:packages

      - name: Type-resolution check (attw) [REQUIRED]
        run: pnpm lint:types

      # ---- WARN-ONLY GATES ----
      # These still need their own fixes before they can block merges; see
      # docs/CI_GATES.md for the current blockers.
      - name: Bundle size budgets (size-limit) [WARN]
        run: pnpm size:packages
        continue-on-error: true

      - name: Publish hygiene (publint --strict) [WARN]
        run: pnpm lint:publish
        continue-on-error: true

  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # WARN-ONLY: each package's build script targets `tsconfig.build.json`,
      # which does not exist yet. This job currently catches type regressions
      # in any package that DOES have one. Promote to required once every
      # publishable package ships a working `tsconfig.build.json`.
      - name: Build all packages (pnpm -r build) [WARN]
        run: pnpm -r build
        continue-on-error: true

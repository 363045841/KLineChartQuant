# Library CI — runs on PRs targeting main and on pushes to main.
#
# Trigger scope is deliberately non-overlapping: feature-branch work is
# validated by the pull_request event only, and main gets a post-merge push
# run. Using `push: ['**']` here would double-run every same-repo PR branch
# (push + pull_request fire for the same commit under different github.ref
# values, so the concurrency group cannot cancel them).
#
# Gate state:
#   - REQUIRED  : type-check:src, type-check:tests, package tests, lint:types (attw)
#   - WARN-ONLY : size:packages, lint:publish, build
#
# type-check and lint:types resolve each workspace package through its
# published entrypoint (dist/*.d.ts), so the `test` job builds them before
# running either gate. The remaining warn-only gates still need their own
# fixes before they can block merges; see docs/CI_GATES.md for the current
# matrix and blockers.

name: library-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: library-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Locale-dependent tests in src/utils/__tests__/dateFormat.spec.ts assume
  # CST (UTC+8) — they were written by the upstream maintainer against
  # local time. CI's default UTC causes off-by-one-day failures around the
  # year boundary. Pin TZ here so the legacy suite matches the maintainer's
  # original calibration. Long-term fix: rewrite dateFormat helpers + tests
  # in UTC-explicit terms (tracked as a follow-up; needs maintainer review
  # because it changes user-visible date strings).
  TZ: 'Asia/Shanghai'

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 两个受支持 LTS 主线均固定到当前最新补丁，确保可复现的 CI 环境。
        node: ['22.23.2', '24.21.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # No packageManager field in root yet; pin to latest 12.x.
          # When packageManager is set, action-setup reads it automatically.
          version: 12

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # type-check and lint:types both resolve the workspace packages through
      # their published entrypoints (dist/*.d.ts), so every package must be
      # built first, in workspace dependency order:
      # core -> agent-runtime -> vue; react and angular depend on core.
      - name: Build packages under the type-resolution gate
        run: |
          pnpm build:packages
          pnpm --filter @363045841yyt/klinechart-react build
          pnpm --filter @363045841yyt/klinechart-angular build

      - name: Type-check source (pnpm type-check:src) [REQUIRED]
        run: pnpm type-check:src

      - name: Type-check tests (pnpm type-check:tests) [REQUIRED]
        run: pnpm type-check:tests

      - name: Run package tests (pnpm -r test)
        run: pnpm test:packages

      - name: Type-resolution check (attw) [REQUIRED]
        run: pnpm lint:types

      # ---- WARN-ONLY GATES ----
      # These still need their own fixes before they can block merges; see
      # docs/CI_GATES.md for the current blockers.
      - name: Bundle size budgets (size-limit) [WARN]
        run: pnpm size:packages
        continue-on-error: true

      - name: Publish hygiene (publint --strict) [WARN]
        run: pnpm lint:publish
        continue-on-error: true

  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.21.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # WARN-ONLY: `pnpm -r build` resolves to every workspace target, not just
      # the publishable packages. It also runs `electron-builder` for
      # packages/desktop-electron and `ng build` for examples/angular-universal,
      # which fails outside that example's own workspace. So this job cannot go
      # green as written; the publishable packages are already built by the test
      # job's "Build packages under the type-resolution gate" step. Narrow this
      # to the publishable set or drop it before promoting it to required.
      - name: Build all packages (pnpm -r build) [WARN]
        run: pnpm -r build
        continue-on-error: true

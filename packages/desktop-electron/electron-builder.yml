appId: com.klinechart.desktop
productName: KLineChart Quant
copyright: Copyright (c) 2026 363045841

directories:
  output: dist
  buildResources: build

files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - '!node_modules/@363045841yyt/klinechart-agent-runtime{,/**/*}'
  - '!node_modules/@earendil-works/pi-agent-core{,/**/*}'
  - '!node_modules/@earendil-works/pi-ai{,/**/*}'
  - '!node_modules/@earendil-works/pi-durable{,/**/*}'

# Go connector 是可执行文件，不能进 asar；按 <platform>-<arch> 分目录，由主进程按运行时选。
extraResources:
  - from: resources/backends
    to: backends
  - from: build
    to: icons
    filter:
      - icon.png
      - icon.ico

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.icns
  # 必须与 Electron 和随包后端的实际系统要求一致，不能只降低此声明。
  minimumSystemVersion: '12.0'
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  executableName: klinechart-desktop
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}

publish: null

appId: com.klinechart.desktop
productName: KLineChart Quant
copyright: Copyright (c) 2026 363045841

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - '!node_modules/@363045841yyt/klinechart-agent-runtime/coverage{,/**/*}'
  - '!node_modules/@363045841yyt/klinechart-agent-runtime/src{,/**/*}'
  - '!node_modules/@363045841yyt/klinechart-agent-runtime/dist/testing{,/**/*}'
  - '!node_modules/@363045841yyt/klinechart-agent-runtime/README.md'
  - '!node_modules/@363045841yyt/klinechart-agent-runtime/tsconfig*.json'
  - '!node_modules/@363045841yyt/klinechart-agent-runtime/vitest.config.ts'

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  executableName: klinechart-desktop
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}

publish: null

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc"><!-- 应用图标：与 README 共用纯色圆底和磨砂折线。 --><title id="title">KlineChartQuant</title><desc id="desc">Frosted market-channel traces inside a solid slate circle.</desc><defs xmlns="http://www.w3.org/2000/svg"><linearGradient id="frost-light" x1="0" y1="72" x2="0" y2="188" gradientUnits="userSpaceOnUse"><stop stop-color="#DEE6EE" /><stop offset=".52" stop-color="#BECBD8" /><stop offset="1" stop-color="#D5DFE8" /></linearGradient><filter id="frost" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation=".18" result="surface" /><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="17" result="noise" /><feColorMatrix in="noise" type="saturate" values="0" result="monochrome" /><feComponentTransfer in="monochrome" result="fine-grain"><feFuncA type="linear" slope=".28" /></feComponentTransfer><feComposite in="fine-grain" in2="SourceAlpha" operator="in" result="clipped-grain" /><feBlend in="surface" in2="clipped-grain" mode="soft-light" /></filter></defs><circle cx="128" cy="128" r="124" fill="#566478" xmlns="http://www.w3.org/2000/svg" />

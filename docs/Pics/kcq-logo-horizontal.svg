  <title id="title">KlineChartQuant</title>
  <desc id="desc">Subtly frosted market-channel lines on a solid slate circle, followed by an outlined graphite KlineChartQuant wordmark.</desc>
  <style>
    .wordmark { fill: #78818F; }
  </style>
